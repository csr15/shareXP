version: '3.8'

services:
  mongodb:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: shareXP

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    depends_on:
      - mongodb
    environment:
      PORT: 8080
      MONGODB_URI: mongodb://mongodb:27017/shareXP
      JWT_SECRET: dev-secret-change-in-production
      CORS_ORIGIN: http://localhost:3000
    volumes:
      - ./server/src:/app/src
    command: npm run dev

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: development
    ports:
      - '3000:3000'
    depends_on:
      - server
    environment:
      REACT_APP_API_URL: http://localhost:8080/api/v1
    volumes:
      - ./client/src:/app/src
    command: npm start

volumes:
  mongo-data:
