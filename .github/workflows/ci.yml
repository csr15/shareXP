name: CI

on:
  push:
    branches: [main, shareXP]
  pull_request:
    branches: [main, shareXP]

jobs:
  server:
    name: Server – Lint, Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  client:
    name: Client – Lint, Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Build
        run: npm run build

      - name: Test
        run: npx react-scripts test --watchAll=false --ci
